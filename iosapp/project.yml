name: BzrApp
options:
  bundleIdPrefix: com.bremo
  developmentLanguage: ar
  deploymentTarget:
    iOS: "16.0"
packages:
  BzrCore:
    path: Core
  DesignSystem:
    path: Packages/DesignSystem
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.19.0
targets:
  BzrApp:
    type: application
    platform: iOS
    sources:
      - BzrApp
    dependencies:
      - package: BzrCore
      - package: DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bremo.app # DEC-048
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_BZRApiBaseURL: "$(BZR_API_BASE_URL)"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  BzrAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BzrAppTests
    dependencies:
      - target: BzrApp
      - package: BzrCore
      - package: DesignSystem
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BzrApp:
    build:
      targets:
        BzrApp: all
    test:
      targets:
        - BzrAppTests
