name: BzrApp
options:
  bundleIdPrefix: com.bremo
  developmentLanguage: ar
  deploymentTarget:
    iOS: "17.0" # @Observable / @Bindable need iOS 17 (owner decision 2026-10-04)
packages:
  BzrCore:
    path: Core
  DesignSystem:
    path: Packages/DesignSystem
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.19.0
  # DEC-058 — APNs through Firebase Messaging; GoogleService-Info.plist is injected at build (DEP-PUSH-02).
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
targets:
  BzrApp:
    type: application
    platform: iOS
    sources:
      - BzrApp
    dependencies:
      - package: BzrCore
      - package: DesignSystem
      - package: Firebase
        product: FirebaseMessaging
      # Crash reports; starts with FirebaseApp.configure() once GoogleService-Info.plist is bundled (DEP-PUSH-02).
      - package: Firebase
        product: FirebaseCrashlytics
    postBuildScripts:
      # Uploads dSYMs so Crashlytics shows symbolicated stacks; skipped until GoogleService-Info.plist is bundled.
      - name: Upload Crashlytics symbols
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          if [ "${CONFIGURATION}" = "Release" ] && [ -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist" ]; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
    entitlements:
      path: BzrApp/BzrApp.entitlements
      properties:
        aps-environment: $(BZR_APS_ENVIRONMENT) # development in Debug, production in Release
        com.apple.developer.associated-domains:
          - applinks:$(BZR_APP_LINK_HOST)
    info:
      path: BzrApp/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.bremo.app.links
            CFBundleURLSchemes: [bremo]
        UIBackgroundModes: [remote-notification]
        FirebaseAppDelegateProxyEnabled: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bremo.app # DEC-048
        BZR_API_BASE_URL: https://dg.dnbscy.com/api/v1/
        BZR_APP_LINK_HOST: dg.dnbscy.com # DEP-LINK-01 / DEP-ID-01
        # Signing: archive with `BZR_TEAM_ID=<Team ID>` (xcodebuild argument or Build Settings); Debug stays unsigned for CI.
        BZR_TEAM_ID: ""
        DEVELOPMENT_TEAM: $(BZR_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only: no iPad screenshots or layouts for review
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO # HTTPS only; skips the export question on every upload
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_BZRApiBaseURL: "$(BZR_API_BASE_URL)"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Location access is required to choose the service address."
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access is required to attach a problem photo."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Photo library access is required to attach selected media."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone access is required to record an audio description."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
      configs:
        Debug:
          BZR_APS_ENVIRONMENT: development
          CODE_SIGNING_ALLOWED: NO
        Release:
          BZR_APS_ENVIRONMENT: production
  BzrAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BzrAppTests
    dependencies:
      - target: BzrApp
      - package: BzrCore
      - package: DesignSystem
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BzrApp:
    build:
      targets:
        BzrApp: all
    test:
      targets:
        - BzrAppTests
